{{ define "main" }}
<div class="content-container">
  <header class="section-header" style="margin-bottom: 2rem;">
    <h1 class="section-title" style="font-size: 1.75rem;">Projects</h1>
  </header>
  <div class="project-grid">
    {{ range .Pages }}
    <a href="{{ .RelPermalink }}" class="project-card">
      <div class="project-card-header">
        <h2 class="project-card-title">{{ .Title }}</h2>
        <p class="project-card-desc">{{ .Summary | plainify | truncate 140 }}</p>
      </div>
      <div class="project-tags">
        {{- range .Params.tags }}
        <span class="project-tag">{{ . }}</span>
        {{- else }}
        <span class="project-tag">Project</span>
        {{- end }}
      </div>
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
