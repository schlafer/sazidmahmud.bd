{{ define "main" }}
<div class="content-container">
  <article>
    <header class="post-header">
      <a href="{{ "/publications/" | relURL }}" class="back-link">&larr; Back to all publications</a>
      <h1 class="post-title">{{ .Title }}</h1>
      <div class="post-meta">
        <span>{{ .Params.venue }} ({{ .Params.year | default (.Date.Format "2006") }})</span>
      </div>
      {{ with .Params.author }}
      <p class="pub-authors" style="margin-top: 0.5rem; font-size: 0.95rem; color: var(--text-muted);">{{ . }}</p>
      {{ end }}
    </header>

    <div class="post-body">
      {{ .Content }}
    </div>
  </article>
</div>
{{ end }}
