<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-left">
      <span>&copy; {{ now.Year }} {{ site.Params.author | default site.Title }}. All rights reserved.</span>
    </div>
    <div class="footer-right">
      <a href="{{ "index.xml" | relURL }}" title="RSS Feed">RSS</a>
      <a href="#top" title="Back to top">↑ Top</a>
    </div>
  </div>
</footer>

{{- $js := resources.Get "js/main.js" | resources.Minify | resources.Fingerprint -}}
<script defer src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}"></script>
