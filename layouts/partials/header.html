<header class="site-header">
  <div class="header-inner">
    <a href="{{ "" | absURL }}" class="site-title" aria-label="{{ site.Title }} Home">
      <span>{{ site.Title }}</span>
    </a>

    <nav class="site-nav" aria-label="Main Navigation">
      <ul class="nav-links">
        {{- range site.Menus.main }}
        <li>
          <a href="{{ .URL | relURL }}" class="nav-link{{ if or (eq $.RelPermalink .URL) ($.IsMenuCurrent "main" .) }} active{{ end }}">
            {{ .Name }}
          </a>
        </li>
        {{- end }}
      </ul>

      <button id="theme-toggle-btn" class="theme-toggle-btn" type="button" aria-label="Toggle light and dark color mode">
        <!-- Moon Icon (for switching to dark) -->
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12.3 4.9c.4-.2.6-.7.5-1.1s-.6-.8-1-.7C6.3 3.8 2.5 8.1 2.5 13.5c0 6.1 4.9 11 11 11 5.4 0 9.7-3.8 10.4-9.3.1-.5-.3-.9-.7-1s-.9.1-1.1.5c-1.3 2.8-4.1 4.8-7.6 4.8-4.7 0-8.5-3.8-8.5-8.5 0-3.5 2-6.3 4.8-7.6z"/>
        </svg>
        <!-- Sun Icon (for switching to light) -->
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
        </svg>
      </button>
    </nav>
  </div>
</header>
