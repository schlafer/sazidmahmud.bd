baseURL: "https://sazidmahmud.bd/"
title: "Sazid Mahmud"
pagination:
  pagerSize: 10
theme: PaperMod

enableEmoji: true
enableRobotsTXT: true

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  title: "Sazid Mahmud"
  description: "Backend Engineering, System Design, Web Security."
  keywords: [Backend, Golang, System Design, Arch Linux, Programming]
  author: "Sazid Mahmud"
  DateFormat: "Jan 2, 2006"
  disableScrollToTop: false
  defaultTheme: auto
  disableThemeToggle: false
  ShowRssButtonInSectionTermList: true
  ShowReadingProgress: true
  ShowShareButtons: true
  favicon:
    ico: "/favicon.ico"
    svg: "/favicon.svg"
    png32: "/favicon-32x32.png"
    png16: "/favicon-16x16.png"
    apple: "/apple-touch-icon.png"

  # Global UI
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowWordCount: true
  ShowCodeCopyButtons: true
  comments: false

  # Global post defaults (can be overridden per-post)
  showAuthor: true
  showDate: true
  showReadingTime: true
  showSummary: true
  showComments: false

  # --------
  # LANDING PAGE (Profile Mode)
  # --------
  profileMode:
    enabled: true
    title: "Sazid Mahmud"
    subtitle: "Tricking rocks into thinking"
    imageUrl: "/images/myprofile.png"
    imageWidth: 140
    imageHeight: 140
    imageTitle: "Profile picture"

  # Disable home blog feed (landing page only)
  homeInfoParams:
    Title: ""
    Content: ""

  socialIcons:
    - name: mail
      url: "mailto:info@sazidmahmud.bd"
    - name: github
      url: "https://github.com/schlafer"
    - name: x
      url: "https://x.com/_schlafer"
    - name: linkedin
      url: "https://linkedin.com/in/sazid-mahmud-eee"
    - name: mastodon
      url: "https://mastodon.social/@schlafer"

menu:
  main:
    - identifier: blog
      name: Blog
      url: /posts/
      weight: 10
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 20
    - identifier: about
      name: About
      url: /about/
      weight: 30
    - identifier: search
      name: Search
      url: /search/
      weight: 40
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 50

# Syntax highlighting
pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
