baseURL: "https://sazidmahmud.bd/"
title: "Sazid Mahmud"
locale: "en-US"
defaultContentLanguage: "en"

pagination:
  pagerSize: 10

buildFuture: true

enableEmoji: true
enableRobotsTXT: true

minify:
  disableXML: false
  minifyOutput: true

outputs:
  home:
    - html
  page:
    - html
  section:
    - html
  taxonomy:
    - html
  term:
    - html

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - \[
              - \]
            - - $$
              - $$
          inline:
            - - \(
              - \)
            - - $
              - $
  highlight:
    noClasses: false
    guessSyntax: true
    lineNos: false

params:
  author: "Sazid Mahmud"
  description: "Software Consultant"
  keywords:
    [
      "Backend",
      "Golang",
      "System Design",
      "Distributed Systems",
      "Linux",
      "Programming",
      "Agentic Engineering",
    ]
  headline: "Software Consultant"
  tagline: "Tricking rocks into thinking"
  pitch: "I design and build resilient backend systems, distributed services, developer tooling"
  avatar: "/images/myprofile.jpeg"
  location: "Dhaka, Bangladesh"
  email: "sazidm@proton.me"
  dateFormat: "Jan 2, 2006"

  socialIcons:
    - name: email
      title: "Email"
      url: "mailto:sazidm@proton.me"
    - name: github
      title: "GitHub"
      url: "https://github.com/schlafer"
    - name: x
      title: "X"
      url: "https://x.com/_schlafer"
    - name: linkedin
      title: "LinkedIn"
      url: "https://linkedin.com/in/sazid-mahmud-eee"
    - name: mastodon
      title: "Mastodon"
      url: "https://mastodon.social/@schlafer"

menu:
  main:
    - identifier: blog
      name: "Thoughts"
      url: "/posts/"
      weight: 10
    # - identifier: projects
    #   name: "Projects"
    #   url: "/projects/"
    #   weight: 20
    - identifier: about
      name: "About"
      url: "/about/"
      weight: 30
